name: Fragment Config Sanitize & Publish

on:
  push:
    branches:
      - main
    paths:
      - "configs/fragment-draft.json"

permissions:
  contents: write

jobs:
  sanitize-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run config sanitizer
        run: node .github/scripts/review-fragment-config.mjs